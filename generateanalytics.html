<!DOCTYPE html>
<html>
<head>
    <title>Generate Analytics|Loan Manager</title>
    <link rel="stylesheet" href="generateanalytics.css">
</head>
<body>
<header class="dashboard-header">
    <div class="header-left">
        <h1>Generate Loan Analytics</h1>
        <p>Generate insights about your loans, EMIs and repayment progress.</p>
    </div>
</header>
<main>
<section class="analytics-card">
    <h2>Analytics Settings</h2>
    <form>
        <label>Loan</label>
        <select>
            <option>All Loans</option>
            <option>Home Loan</option>
            <option>Personal Loan</option>
            <option>Vehicle Loan</option>
        </select>
        <label>Analysis Period</label>
        <select>
            <option>Current Year</option>
            <option>Last 6 Months</option>
            <option>Last 12 Months</option>
        </select>
        <button class="primary-btn">Generate Analytics</button>
    </form>
</section>
</main>
<footer>
    <p>© 2026 Financehub.All rights reserved.</p>
</footer>
</body>
</html>
