<!DOCTYPE html>
<html>
<head>
    <title>View Wallet|Rewards Tracker</title>
    <link rel="stylesheet" href="viewwallet.css">
</head>
<body>
<header class="dashboard-header">
    <div class="header-left">
        <h1>Rewards Wallet</h1>
        <p>View your cashback balance, reward points and redemption history.</p>
    </div>
</header>
<main>
<section class="wallet-summary">
    <div class="wallet-card">
        <h3>Cashback Balance</h3>
        <h2>₹2,450</h2>
    </div>
    <div class="wallet-card">
        <h3>Reward Points</h3>
        <h2>12,500</h2>
    </div>
</section>
<section class="wallet-history">
    <h2>Recent Activity</h2>
    <div class="wallet-item">
        <span>Cashback Earned</span>
        <strong>+₹250</strong>
    </div>
    <div class="wallet-item">
        <span>Reward Redeemed</span>
        <strong>-5,000 points</strong>
    </div>
</section>
</main>
<footer>
    <p>© 2026 Financehub.All rights reserved.</p>
</footer>
</body>
</html>
