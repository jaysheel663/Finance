<!DOCTYPE html>
<html>
<head>
    <title>Export Loan Report</title>
    <link rel="stylesheet" href="loananalyticsexportreport.css">
</head>
<body>
<header class="dashboard-header">
    <div class="header-left">
        <h1>Export Loan Report</h1>
        <p>Download your loan analytics and repayment information.</p>
    </div>
</header>
<main>
<section class="section-title">
    <h2>Export Analytics</h2>
    <p>Choose the loan report you want to download.</p>
</section>
<section class="export-card">
    <form>
        <label>Loan</label>
        <select>
            <option>All Loans</option>
            <option>Home Loan</option>
            <option>Personal Loan</option>
            <option>Education Loan</option>
            <option>Vehicle Loan</option>
        </select>
        <label>Report Format</label>
        <select>
            <option>PDF</option>
            <option>Excel</option>
            <option>CSV</option>
        </select>
        <button type="submit" class="primary-btn">
            <i class="fas fa-file-export"></i> Export Report</button>
    </form>
</section>
</main>
<footer>
    <p>© 2026 Financehub.All rights reserved.</p>
</footer>
</body>
</html>
