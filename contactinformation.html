        <p>support@financialdashboard.com</p>

    <div class="contact-card">
        <i class="fas fa-phone"></i>
        <h2>Phone Support</h2>
        <p>+91 98765 43210</p>
        <button class="primary-btn">Call Support</button>
    </div>
    <div class="contact-card">
        <i class="fas fa-comments"></i>

        <p>Connect with our support team online.</p>
        <button class="primary-btn">Start Chat</button>
