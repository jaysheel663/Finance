<!DOCTYPE html>
<html>
<head>
    <title>Filter Transactions|Financial Dashboard</title>
    <link rel="stylesheet" href="filtertransactions.css">
</head>
<body>
<header class="dashboard-header">
    <div class="header-left">
        <h1>Filter Transactions</h1>
        <p>Find transactions quickly using date, category and transaction type.</p>
    </div>
    <div class="header-right">
        <button class="secondary-btn" onclick="history.back()">
            <i class="fas fa-arrow-left"></i> Back</button>
    </div>
</header>
<main>
<section class="section-title">
    <h2>Transaction Filters</h2>
    <p>Apply filters to narrow down your transaction history.</p>
</section>
<section class="filter-card">
    <form>
        <label for="from-date">From Date</label>
        <input type="date" id="from-date">
        <label for="to-date">To Date</label>
        <input type="date" id="to-date">
        <label for="category">Category</label>
        <select id="category">
            <option>All Categories</option>
            <option>Food</option>
            <option>Shopping</option>
            <option>Utilities</option>
            <option>Transport</option>
            <option>Investment</option>
        </select>
        <label for="type">Transaction Type</label>
        <select id="type">
            <option>All Transactions</option>
            <option>Credit</option>
            <option>Debit</option>
        </select>
        <label for="amount">Amount Range</label>
        <select id="amount">
            <option>Any Amount</option>
            <option>Below ₹1,000</option>
            <option>₹1,000-₹5,000</option>
            <option>₹5,000-₹10,000</option>
            <option>Above ₹10,000</option>
        </select>
        <div class="form-actions">
            <button type="reset" class="secondary-btn">Clear Filters</button>
            <button type="submit" class="primary-btn">
                <i class="fas fa-filter"></i> Apply Filters</button>
        </div>
    </form>
</section>
</main>
<footer>
    <p>© 2026 Financehub.All rights reserved.</p>
</footer>
</body>
</html>
