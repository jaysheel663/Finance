<!DOCTYPE html>
<html>
<head>
    <title>Start Messaging|Financial Dashboard</title>
    <link rel="stylesheet" href="startmessaging.css">
</head>
<body>
<header class="dashboard-header">
    <div class="header-left">
        <h1>Start Messaging</h1>
        <p>Connect with our support team for help with your financial questions.</p>
    </div>
    <div class="header-right">
        <button class="secondary-btn" onclick="history.back()">
            <i class="fas fa-arrow-left"></i>Back</button>
    </div>
</header>
<main>
<section class="messaging-section">
    <div class="chat-card">
        <div class="chat-header">
            <div>
                <h2>Financial Support</h2>
                <p><span class="online-dot"></span> Support team online</p>
            </div>
            <i class="fas fa-headset"></i>
        </div>
        <div class="chat-area">
            <div class="message support-message">Hello! Welcome to Financial Support.How can we help you today?</div>
            <div class="message user-message">I need help with my financial account.</div>
        </div>
        <form class="message-form">
            <input type="text"placeholder="Type your message..."required>
            <button type="submit" class="primary-btn">
                <i class="fas fa-paper-plane"></i>Send</button>
        </form>
    </div>
</section>
</main>
<footer>
    <p>© 2026 Financehub.All rights reserved.</p>
</footer>
</body>
</html>
