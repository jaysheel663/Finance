<!DOCTYPE html>
<html>
<head>
    <title>Edit Information|Financial Dashboard</title>
    <link rel="stylesheet" href="editinformation.css">
</head>
<body>
<header class="dashboard-header">
    <div class="header-left">
        <h1>Edit Information</h1>
        <p>Update your personal and contact information.</p>
    </div>
</header>
<main>
<section class="profile-form-card">
    <h2>Personal Information</h2>
    <form>
        <label>Full Name</label>
        <input type="text" value="Your Name">
        <label>Email Address</label>
        <input type="email" value="you@example.com">
        <label>Phone Number</label>
        <input type="tel" placeholder="+91">
        <label>Date of Birth</label>
        <input type="date">
        <label>City</label>
        <input type="text" placeholder="Enter city">
        <button type="submit" class="primary-btn">Save Information</button>
    </form>
</section>
</main>
<footer>
    <p>© 2026 Financehub.All rights reserved.</p>
</footer>
</body>
</html>
