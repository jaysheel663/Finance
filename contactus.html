<!DOCTYPE html>
<html>
<head>
    <title>Contact Us|Financial Dashboard</title>
    <link rel="stylesheet" href="contactus.css">
</head>
<body>
<header class="dashboard-header">
    <div class="header-left">
        <h1>Contact Us</h1>
        <p>We're here to help with your financial questions and concerns.</p>
    </div>
</header>
<section class="contact-section">
    <div class="contact-info">
        <i class="fas fa-headset"></i>
        <h2>Get in Touch</h2>
        <p>Reach out to our support team and we'll help you with your query.</p>
        <div class="contact-item">
            <i class="fas fa-envelope"></i>
            <span>support@financialdashboard.com</span>
        </div>
        <div class="contact-item">
            <i class="fas fa-phone"></i>
            <span>+91 98765 43210</span>
        </div>
    </div>
    <form class="contact-form">
        <label>Your Name</label>
        <input type="text" placeholder="Enter your name" required>
        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" required>
        <label>Message</label>
        <textarea rows="6" placeholder="Write your message..." required></textarea>
        <button type="submit" class="primary-btn">
            <i class="fas fa-paper-plane"></i>Send Message</button>
    </form>
</section>
<footer>
    <p>© 2026 Financial Dashboard. All rights reserved.</p>
</footer>
</body>
</html>
