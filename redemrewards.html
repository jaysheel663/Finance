<!DOCTYPE html>
<html>
<head>
    <title>Redeem Rewards|Rewards Tracker</title>
    <link rel="stylesheet" href="redeemrewards.css">
</head>
<body>
<header class="dashboard-header">
    <div class="header-left">
        <h1>Redeem Rewards</h1>
        <p>Use your available reward points for eligible rewards.</p>
    </div>
</header>
<main>
<section class="reward-summary">
    <div class="summary-card">
        <h3>Available Points</h3>
        <h2>12,500</h2>
    </div>
</section>
<section class="rewards-grid">
    <div class="reward-card">
        <h2>₹500 Cashback</h2>
        <p>5,000 points</p>
        <button class="primary-btn">Redeem</button>
    </div>
    <div class="reward-card">
        <h2>₹1,000 Voucher</h2>
        <p>10,000 points</p>
        <button class="primary-btn">Redeem</button>
    </div>
    <div class="reward-card">
        <h2>₹2,000 Voucher</h2>
        <p>20,000 points</p>
        <button class="secondary-btn">Need More Points</button>
    </div>
</section>
</main>
<footer>
    <p>© 2026 Financehub.All rights reserved.</p>
</footer>
</body>
</html>
